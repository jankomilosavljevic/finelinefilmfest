<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fine Line Film Fest</title>
    <meta name="description" content="Fine Line Film Fest – short film festival in Belgrade, Serbia. Made for filmmakers by filmmakers.">
    <meta name="theme-color" content="#000000">
    <meta property="og:title" content="Fine Line Film Fest">
    <meta property="og:description" content="Made for filmmakers by filmmakers.">
    <meta property="og:image" content="files/images/editions/2023/photo17.webp">
    <link rel="icon" href="files/images/logo/logo.webp" type="image/webp">

    <link rel="preload" href="files/images/editions/2023/photo17.webp" as="image" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>document.documentElement.classList.add('js')</script>

    <script src="assets/js/i18n.js" defer></script>
    <script src="assets/js/main.js" defer></script>
</head>
<body>

<header class="site-header">
    <a class="brand" href="./" aria-label="Fine Line Film Fest">
        <img src="files/images/logo/logo.webp" alt="Fine Line Film Fest" width="56" height="42">
    </a>
    <nav class="main-nav" id="main-nav">
        <a href="festival.html" data-i18n="nav.festival">Festival</a>
        <a href="o-nama.html" data-i18n="nav.about">O nama</a>
        <a href="arhiva.html" data-i18n="nav.archive">Arhiva</a>
        <a href="kontakt.html" data-i18n="nav.contact">Kontakt</a>
    </nav>
    <div class="lang-switch">
        <button type="button" data-lang="sr">SR</button>
        <button type="button" data-lang="en">EN</button>
    </div>
    <button class="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="Menu"><span></span><span></span></button>
</header>

<main>
    <section class="hero">
        <img class="hero-bg" src="files/images/editions/2023/photo17.webp" alt="" fetchpriority="high">
        <div class="hero-shade"></div>

        <div class="hero-inner">
            <img class="hero-logo" src="files/images/logo/logo.webp" alt="Fine Line Film Fest" width="520" height="390">
            <span class="hero-line" aria-hidden="true"></span>
            <div class="hero-info">
                <p class="hero-tagline">Made for filmmakers<br>by filmmakers</p>

                <!-- Datum, logo lokacije i link za prijave dolaze iz data/site.json (kasnije iz admin panela) -->
                <div class="hero-event" data-event hidden>
                    <p class="hero-date" data-field="dates"></p>
                    <img class="hero-venue" data-field="venue" alt="" hidden>
                </div>

                <a class="submit-btn" href="#" target="_blank" rel="noopener" data-field="submit">
                    <span data-i18n="submit">Pošalji prijavu</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
            </div>
        </div>
    </section>

    <!-- 2. DOSADAŠNJA SELEKCIJA – filmovi dolaze iz data/selection.json -->
    <section class="selection" id="selekcija">
        <div class="selection-head">
            <h2 class="selection-title" data-i18n="selection.title">Dosadašnja selekcija</h2>
            <div class="year-filter" role="tablist" data-years></div>
        </div>

        <div class="film" data-film>
            <button class="film-media" type="button" data-film-media>
                <img alt="" data-film-img>
                <span class="film-play" data-film-play hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                </span>
            </button>
            <div class="film-body">
                <p class="film-meta" data-film-meta></p>
                <h3 class="film-name" data-film-title></h3>
                <p class="film-director"><span data-i18n="film.director">Režija</span>: <strong data-film-director></strong></p>
                <p class="film-synopsis" data-film-synopsis></p>
                <button class="film-trailer" type="button" data-film-trailer hidden>
                    <span data-i18n="film.trailer">Pogledaj trejler</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </div>

        <div class="film-nav">
            <button type="button" class="film-arrow" data-film-prev aria-label="Prev">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            </button>
            <span class="film-count" data-film-count></span>
            <button type="button" class="film-arrow" data-film-next aria-label="Next">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
        </div>
    </section>
</main>

<!-- Sopstvena linija skrola: pokazuje gde si i koliko stranica ima -->
<div class="scrollbar" aria-hidden="true"><span class="scrollbar-thumb"></span></div>

<!-- Trejler -->
<div class="modal" data-modal hidden>
    <button class="modal-close" type="button" data-modal-close aria-label="Close">×</button>
    <div class="modal-frame"><iframe title="Trailer" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
</div>

</body>
</html>
